[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG pipeline for document retrieval and question answering"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-huggingface==1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters==1.1.2",
    "pypdf==6.19.0",
    "python-dotenv==1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers==6.0.1",
    "tiktoken==0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs", "web", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
